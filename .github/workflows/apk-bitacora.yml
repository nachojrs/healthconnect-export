name: APK Bitácora

on:
  push:
    branches: [ bitacora ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
    - uses: android-actions/setup-android@v4
      with:
        accept-android-sdk-licenses: true
    - run: echo "sdk.dir=${ANDROID_HOME}" > local.properties
    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace
    - name: Rename APK
      run: cp app/build/outputs/apk/debug/app-debug.apk HC-Export-Bitacora.apk
    - name: Publish release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: bitacora-${{ github.run_number }}
        name: HC Export Bitácora ${{ github.run_number }}
        body: Versión corregida para la Bitácora de Salud (sueño por día de despertar, una sola fuente, sin copias).
        files: HC-Export-Bitacora.apk
